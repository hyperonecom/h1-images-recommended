name: ubuntu-2404-noble
codename: Noble Numbat
pname: Ubuntu 24.04 (Noble Numbat)
distro: ubuntu
edition: server
arch: x64
version: '24.04'
build: true
format: qcow
disk_size: '5'
# cloud_init_ds_src: ./resources/cloud-init/ds_v3/DataSourceRbxCloud.py
cloud_init_install: false
custom_scripts:
  # - ./scripts/resolv.sh
  - ./scripts/disable-llmr-mdns.sh
  - ./scripts/fstab.sh
  - ./scripts/ubuntu/ubuntu-2404.sh
  # - ./scripts/ubuntu/cli.sh
  - ./scripts/apt_clean.sh
  - ./scripts/check_df.sh
  - ./scripts/io_scheduler.sh
  - ./scripts/patch-cloud-init.sh
uefi_support: true
source:
  url: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
  type: qcow
  mount:
    root: p1
    boot: p16