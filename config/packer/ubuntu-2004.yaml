name: ubuntu-2004-focal
codename: focal fossa
pname: Ubuntu 20.04 (focal fossa)
distro: ubuntu
edition: server
arch: x64
version: '20.04'
build: true
disk_size: '5'
cloud_init_install: false
custom_scripts:
  - ./scripts/resolv.sh
  - ./scripts/fstab.sh
  - ./scripts/ubuntu/ubuntu-1710.sh
  - ./scripts/ubuntu/cli.sh
  - ./scripts/io_scheduler.sh
  - ./scripts/apt_clean.sh
  - ./scripts/check_df.sh
uefi_support: true
cli_support: true
format: qcow
repology_repo: 'ubuntu_20_04'
source:
  url: https://cloud-images.ubuntu.com/releases/focal/release/ubuntu-20.04-server-cloudimg-amd64.img
  type: qcow
  mount:
    root: p1
