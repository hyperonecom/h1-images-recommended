name: ubuntu-2510-questing
codename: questing quokka
pname: Ubuntu 25.10 (Questing Quokka)
distro: ubuntu
edition: server
arch: x64
version: '25.10'
build: true
format: qcow
disk_size: '5'
# cloud_init_ds_src: ./resources/cloud-init/ds_v3/DataSourceRbxCloud.py
cloud_init_install: false
custom_scripts:
  # - ./scripts/resolv.sh
  - ./scripts/disable-llmr-mdns.sh
  - ./scripts/fstab.sh
  - ./scripts/ubuntu/ubuntu-2504.sh
  # - ./scripts/ubuntu/cli.sh
  - ./scripts/apt_clean.sh
  - ./scripts/check_df.sh
  - ./scripts/io_scheduler.sh
  - ./scripts/patch-cloud-init.sh
uefi_support: true
source:
  url: https://cloud-images.ubuntu.com/releases/questing/release/ubuntu-25.10-server-cloudimg-amd64.img
  type: qcow
  mount:
    root: p1
    boot: p13